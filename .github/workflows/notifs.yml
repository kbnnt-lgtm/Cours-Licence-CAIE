# Notifications push : à chaque mise à jour du site et toutes les 10 minutes.
name: Notifications
on:
  push:
    branches: [main]
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
concurrency:
  group: notifs
  cancel-in-progress: false
jobs:
  envoi:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --prefix notifs --no-audit --no-fund firebase-admin@12.7.0
      - run: node notifs/send.mjs
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
