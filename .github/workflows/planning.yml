# Planning automatique : chaque nuit (et à la demande), relit l'agenda iCal dont le lien est
# dans le secret PLANNING_ICS et met à jour planning.js s'il a changé. Sans secret, ne fait rien.
name: Planning
on:
  schedule:
    - cron: "15 3 * * *"
    - cron: "15 11 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: planning
  cancel-in-progress: false
jobs:
  maj:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 notifs/planning-ics.py planning.js
        env:
          PLANNING_ICS: ${{ secrets.PLANNING_ICS }}
          DIAG: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
      - run: |
          if ! git diff --quiet planning.js; then
            git config user.name "planning-auto"
            git config user.email "planning-auto@users.noreply.github.com"
            git commit -m "Planning mis à jour depuis l'agenda" planning.js
            git push
          fi
